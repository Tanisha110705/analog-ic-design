<text x="300" y="420" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" text-anchor="start" font-weight="normal">≈ 574 mV DC</text>
<line x1="720" y1="78" x2="720" y2="243.0" stroke="#1f2933" stroke-width="2"/>
<line x1="720" y1="275.0" x2="720" y2="440" stroke="#1f2933" stroke-width="2"/>
<circle cx="720" cy="259.0" r="16" fill="white" stroke="#1f2933" stroke-width="2"/>
<text x="720" y="256.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">+</text>
<text x="720" y="270.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">−</text>
<text x="744" y="260" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52606d" text-anchor="start" font-weight="normal">1.8 V</text>
<text x="400" y="490" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52606d" text-anchor="middle" font-weight="normal">Rout ≈ RD ‖ (gm1·ro1·ro2) ≈ RD, so gain ≈ gm2·RD and the output pole ≈ 1/(2π·RD·CL).</text>
<text x="400" y="508" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0b6bcb" text-anchor="middle" font-weight="normal">Reported: max gain 17.7657 dB, f−3dB 20.1298 MHz (targets: 20 dB, 20 MHz).</text>
<text x="400.0" y="548" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" text-anchor="middle" font-weight="normal" font-style="italic">Redrawn from the Virtuoso schematic (UMC 180 nm, N_18_MM). RD label discrepancy discussed in docs/cascode-amplifier.md.</text>
</svg>
