<polygon points="376,374 368,369 368,379" fill="#1f2933"/>
<text x="412" y="358" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold">M2 (input)</text>
<text x="412" y="374" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" text-anchor="start" font-weight="normal">W/L = 46.5 µm / 180 nm</text>
