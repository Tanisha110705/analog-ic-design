<text x="380" y="410" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52606d" text-anchor="middle" font-weight="normal">M2 is diode-connected; with equal sizes M0 copies IREF when VDS0 ≈ VGS.</text>
<text x="380" y="428" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52606d" text-anchor="middle" font-weight="normal">Away from that point Iout follows VOUT through channel-length modulation (L = 180 nm).</text>
<text x="380.0" y="458" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" text-anchor="middle" font-weight="normal" font-style="italic">Redrawn from the Virtuoso schematic (UMC 180 nm, N_18_MM). Not simulation output.</text>
